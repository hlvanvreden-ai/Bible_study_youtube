<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px 16px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 14px;
    }
    .header h1 { color: #f4ead4; font-size: 24px; margin: 0; }
    .badge {
      background: #1e293b;
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      transition: opacity 0.3s ease;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .row-pill {
      background: #0f172a;
      color: #f4ead4;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .latest-tag {
      background: #0284c7;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    h2 { color: #f4ead4; font-size: 19px; margin: 6px 0 10px; }
    .meta { color: #94a3b8; font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
    .thumb-link {
      display: block;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      margin-bottom: 14px;
      border: 1px solid #334155;
      text-decoration: none;
    }
    .thumb-link img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }
    .thumb-link:hover img {
      transform: scale(1.02);
    }
    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.38);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-pill {
      background: #dc2626;
      color: #ffffff;
      padding: 11px 20px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }
    .thumb-link:hover .play-pill {
      background: #b91c1c;
    }
    .notes {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      box-sizing: border-box;
      margin-bottom: 14px;
      resize: vertical;
    }
    .actions { display: flex; gap: 10px; margin-top: auto; }
    button {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-approve { background: #16a34a; color: white; }
    .btn-approve:hover { background: #15803d; }
    .btn-reject { background: #dc2626; color: white; }
    .btn-reject:hover { background: #b91c1c; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      color: #38bdf8;
      min-height: 18px;
    }
    .empty-state {
      background: #1e293b;
      border-radius: 14px;
      padding: 48px 24px;
      text-align: center;
      color: #94a3b8;
    }
  </style>
</head>
