name: Daily Bible Study Video Production

on:
  repository_dispatch:
    types: [fetch_notebook_studies, build_daily_video]
  workflow_dispatch:
    inputs:
      action_mode:
        description: "Mode: fetch_and_build | fetch_only | build_only"
        required: false
        default: "fetch_and_build"

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-*/policy.xml || true
          pip install google-genai gspread google-auth google-api-python-client edge-tts moviepy==1.0.3 Pillow notebooklm-py

      - name: Configure NotebookLM Auth
        if: >-
          (github.event_name == 'repository_dispatch' && github.event.action == 'fetch_notebook_studies') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_mode != 'build_only')
        run: |
          mkdir -p ~/.notebooklm
          echo '${{ secrets.NOTEBOOKLM_STORAGE_JSON }}' > ~/.notebooklm/storage_state.json
          
      - name: Step 1 - Fetch Missing Studies from NotebookLM
        if: >-
          (github.event_name == 'repository_dispatch' && github.event.action == 'fetch_notebook_studies') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_mode != 'build_only')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NOTEBOOKLM_STORAGE_JSON: ${{ secrets.NOTEBOOKLM_STORAGE_JSON }}
          NOTEBOOK_TITLE: "Bible study"
        run: python scripts/fetch_from_notebook.py

      - name: Step 2 - Render Video (Stage 1) or Schedule Approved Video (Stage 2)
        if: >-
          (github.event_name == 'repository_dispatch' && github.event.action == 'build_daily_video') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_mode != 'fetch_only')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          REVIEW_WEBAPP_URL: ${{ secrets.REVIEW_WEBAPP_URL }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python scripts/generate_and_publish.py
