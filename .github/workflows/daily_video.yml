name: Daily Bible Study Video Production

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 02:00 UTC (04:00 AM SAST)
  repository_dispatch:
    types: [build_daily_video]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Fix ImageMagick policy for MoviePy
        run: |
          POLICY_FILE=$(find /etc/ImageMagick* -name "policy.xml" 2>/dev/null | head -n 1)
          if [ -n "$POLICY_FILE" ]; then
            sudo sed -i 's/none/read,write/g' "$POLICY_FILE"
            echo "Updated $POLICY_FILE"
          else
            echo "No policy.xml found; skipping."
          fi

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install google-genai gspread google-auth google-auth-oauthlib google-api-python-client edge-tts moviepy==1.0.3 pillow

      - name: Run Production Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          REVIEW_WEBAPP_URL: ${{ secrets.REVIEW_WEBAPP_URL }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python scripts/generate_and_publish.py
