name: Daily Bible Study Video Production

on:
  repository_dispatch:
    types: [fetch_notebook_studies, prepare_study_metadata, build_daily_video, send_approval_notifications]
  workflow_dispatch:
    inputs:
      action_mode:
        description: "Mode: fetch_and_build | fetch_only | build_only | prepare_only"
        required: false
        default: "fetch_and_build"

concurrency:
  group: bible-study-video-pipeline
  cancel-in-progress: false

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" google-genai gspread google-auth google-api-python-client edge-tts "moviepy==1.0.3" Pillow notebooklm-py

      - name: Configure NotebookLM authentication
        if: >-
          (github.event_name == 'repository_dispatch' && github.event.action == 'fetch_notebook_studies') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_mode != 'build_only')
        env:
          NOTEBOOKLM_STORAGE_JSON: ${{ secrets.NOTEBOOKLM_STORAGE_JSON }}
        run: |
          mkdir -p ~/.notebooklm
          python - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get("NOTEBOOKLM_STORAGE_JSON", "")
          if not value:
              raise SystemExit("Missing GitHub secret: NOTEBOOKLM_STORAGE_JSON")
          Path.home().joinpath(".notebooklm", "storage_state.json").write_text(value, encoding="utf-8")
          PY

      - name: Step 1 - Fetch missing studies from NotebookLM
        if: >-
          (github.event_name == 'repository_dispatch' && github.event.action == 'fetch_notebook_studies') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_mode != 'build_only')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NOTEBOOK_TITLE: "Bible study"
        run: python scripts/fetch_from_notebook.py

      - name: Step 1b - Prepare render metadata (Creative Brief & Slides)
        if: >-
          (github.event_name == 'repository_dispatch' && github.event.action == 'prepare_study_metadata') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_mode != 'build_only')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/prepare_study_metadata.py

      - name: Step 2 - Render video, schedule approved video, or send approval notifications
        if: >-
          (github.event_name == 'repository_dispatch' && (github.event.action == 'build_daily_video' || github.event.action == 'send_approval_notifications')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action_mode != 'fetch_only')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          REVIEW_WEBAPP_URL: ${{ secrets.REVIEW_WEBAPP_URL }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DISPATCH_ACTION: ${{ github.event_name == 'repository_dispatch' && github.event.action || github.event.inputs.action_mode }}
        run: python scripts/generate_and_publish.py
